name: test

# 常规回归门(不参与发布):本机/PR 覆盖三平台编译与平台替换用例;
# Windows/Linux 的 apply 用例带构建标签,只能在对应 runner 实跑(spec §5.8)。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.25', cache-dependency-path: go.sum }
      # 排除根包:根包经 wails 拉入 Linux GTK/WebKit cgo 依赖,且 go:embed frontend/dist
      # 需先构建前端;根包编译由 release.yml 的 wails build 覆盖。平台替换用例
      # (TestLinux*/TestWindows*)位于 internal/updater,故在此限定非根包范围。
      - run: go vet ./internal/... ./bridge/ ./tools/...
      - run: go test ./internal/... ./bridge/ ./tools/... -count=1
      - run: go test -race ./internal/updater/ ./bridge/
  go-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.25', cache-dependency-path: go.sum }
      # 同上:排除根包(frontend/dist 嵌入 + wails 平台依赖);平台替换用例在 internal/updater。
      - run: go vet ./internal/... ./bridge/ ./tools/...
      - run: go test ./internal/updater/ ./bridge/ -count=1   # TestWindows* 实跑(§5.8)
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test -- --run && npm run build
