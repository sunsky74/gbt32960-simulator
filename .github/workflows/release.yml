name: release

# 推送 v* 标签时:三平台矩阵构建 → 汇总产物 → 创建 GitHub Release
# 前置条件:协议库 github.com/sunsky74/gb32960 已发布,go.mod 按版本号引用(而非本地 replace)

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 创建 Release 必需

env:
  NODE_OPTIONS: "--max-old-space-size=4096" # 前端构建防 OOM(wails 官方文档推荐)
  WAILS_VERSION: "v2.15.0" # wails CLI 固定版本,勿用 latest
  APP_NAME: "gbt32960-simulator" # 与 wails.json outputfilename 一致

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # out 为各平台产物路径(upload-artifact 用);app 名与 wails.json outputfilename 一致
        include:
          - { os: ubuntu-latest, platform: linux/amd64, artifact: linux-amd64, out: "build/bin/gbt32960-simulator" }
          - { os: windows-latest, platform: windows/amd64, artifact: windows-amd64, out: "build/bin/*.exe" }
          # macOS 双产物:zip(自更新资产,updater 按此名下载) + dmg(人工拖拽安装);多路径用换行分隔
          - { os: macos-latest, platform: darwin/universal, artifact: macos-universal, out: "build/bin/*.zip\nbuild/bin/*.dmg" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25' # wails v2.15.0 要求 go 1.25.0
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux 依赖 (ubuntu-latest = 24.04 → WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config libegl1

      - name: 安装 NSIS (windows-latest 已不再预装;须显式写入 PATH,否则 makensis 不可见)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
        shell: pwsh

      - name: 安装 Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash

      # 说明:main 包没有 version 变量时,-X main.version 会被链接器静默忽略;
      # 需要版本戳可在 main.go 增加 var version string 并在界面中展示。
      - name: 构建 (linux/amd64)
        if: runner.os == 'Linux'
        run: wails build -platform linux/amd64 -clean -trimpath -tags webkit2_41 -ldflags "-X main.version=${GITHUB_REF_NAME}"
        shell: bash

      - name: 构建 (windows/amd64 + NSIS 安装包)
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64 -clean -trimpath -nsis -installscope user -webview2 download -ldflags "-X main.version=${GITHUB_REF_NAME}"
        shell: bash

      - name: 构建 (darwin universal)
        if: runner.os == 'macOS'
        run: wails build -platform darwin/universal -clean -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}"
        shell: bash

      - name: 打包 macOS .app (ditto 保留 bundle 符号链接/权限)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "build/bin/${APP_NAME}.app" "build/bin/${APP_NAME}.app.zip"
        shell: bash

      # 不签名/不公证(方式 A):dmg 只解决“装到 /Applications”与 App Translocation,
      # 首次打开仍需用户在 系统设置→隐私与安全性 放行,说明随包提供。
      - name: 打包 macOS DMG(Applications 符号链接 + 安装说明)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          cp -R "build/bin/${APP_NAME}.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          cat > "$STAGE/安装说明.txt" <<'TXT'
          安装方法
          1. 把左侧的 gbt32960-simulator 拖到右侧的“应用程序”文件夹。
          2. 首次打开若提示“无法验证开发者”,去 系统设置 → 隐私与安全性 → 仍要打开。

          为什么要拖进去
          - 直接双击下载目录里的 .app,系统会把运行路径改写为随机只读位置。
          - 拖进“应用程序”后路径固定,自更新与权限都正常。

          仍无法打开时(未签名版本,属预期)
          - 终端执行:xattr -dr com.apple.quarantine /Applications/gbt32960-simulator.app
          - 或 系统设置 → 隐私与安全性 → 安全性 → “仍要打开”

          校验下载包
          - shasum -a 256 gbt32960-simulator-*.dmg
          TXT
          hdiutil create -volname "${APP_NAME} ${GITHUB_REF_NAME}" \
            -srcfolder "$STAGE" -ov -format UDZO \
            "build/bin/${APP_NAME}-${GITHUB_REF_NAME}.dmg"
          rm -rf "$STAGE"
          ls -lh build/bin/*.dmg
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: wails-${{ matrix.artifact }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wails-*
          merge-multiple: true
          path: release

      - name: 生成 SHA256SUMS(排除自身;客户端契约 `hash  name`)
        run: |
          cd release
          for f in *; do
            [ "$f" = "SHA256SUMS" ] && continue
            sha256sum "$f"
          done > SHA256SUMS
          echo "—— SHA256SUMS ——"
          cat SHA256SUMS
        shell: bash

      # 说明:SHA256SUMS.sig 不在 CI 生成(私钥离线保管);发布者本地签名后上传,见 docs/release-signing.md

      - uses: softprops/action-gh-release@v3
        with:
          files: release/**
          fail_on_unmatched_files: true
          generate_release_notes: true
